[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'document-convert'
version = '0.1.0'
description = 'Local PDF to editable DOCX conversion with optional OCR.'
readme = 'README.md'
requires-python = '>=3.11'
license = {text = 'MIT'}
dependencies = [
  'pdf2docx==0.5.8',
  'PyMuPDF==1.25.5',
  'pypdf==5.9.0',
  'python-docx==1.2.0',
]

[project.optional-dependencies]
ocr = ['ocrmypdf==15.4.4']
test = ['pytest==8.4.1']

[project.scripts]
document-convert = 'document_convert.cli:main'

[tool.setuptools]
package-dir = {'' = 'src'}

[tool.setuptools.packages.find]
where = ['src']
